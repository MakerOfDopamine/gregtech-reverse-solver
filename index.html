<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GregTech Processing Chain Balancer</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div id="screen">
        <div id="control-panel">
            <form id="add-resource">
                <span>Add a <b>resource</b>: </span>
                <input type="text" id="add-resource-input">
                <button type="submit">Add</button>
            </form><br>

            <form id="remove-resource">
                <span>Remove a <b>resource</b>: </span>
                <input type="text" id="remove-resource-input">
                <button type="submit">Remove</button>
            </form><br>

            <form id="add-process">
                <span>Create a <b>process</b>: </span>
                <input type="text" id="add-process-input">
                <button type="submit">Create process</button>
            </form>

            <hr>

            <div id="resource-types">
                
            </div>

            <hr>
            
            <div id="processes">

            </div>
        </div>
        <div id="info-panel">
            <h2>GregTech Processing Chain Balancer</h2>
            <p>This project is for balancing the various production chains of things in GregTech modpacks. Input all the separate productions on the left, and the results will be shown in the bottom.</p>
        </div>
    </div>
</body>
</html>
